name: Update CSI 1000 market data

on:
  schedule:
    - cron: "30 10 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update market data
        run: python scripts/update_market_data.py

      - name: Commit updated data if changed
        run: |
          if git diff --quiet -- data/csi1000-history.json; then
            echo "No market-data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/csi1000-history.json
          git commit -m "chore(data): update CSI 1000 market data"
          git push
